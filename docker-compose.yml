name: ifc-brain-generic

services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-IfcBrain2026!}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-512m}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "neo4j status >/dev/null 2>&1 || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 30
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      IFC_DATA_DIR: /data
      VIEWER_DIR: /app/viewer
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-IfcBrain2026!}"
      NEO4J_DATABASE: neo4j
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-1000}"
    volumes:
      - model_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status', timeout=4).read()"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s

volumes:
  neo4j_data:
  neo4j_logs:
  model_data:
