name: Acoustic scale validation

on:
  push:
    branches:
      - agent/acoustic-scale-validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Git LFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-lfs
          git lfs install
      - name: Fetch benchmark script
        run: curl -fsSL https://raw.githubusercontent.com/ealins/ifc-label-cesium-v2/agent/acoustic-scale-validation/scale_validation.py -o scale_validation.py
      - name: Run direct STEP benchmark
        run: python3 scale_validation.py
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-scale-validation-results
          path: results/
